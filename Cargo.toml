# Workspace root for the Praxis Policy Engine.
#
# Edition 2024 and resolver 3. The import landed on the source tree's edition 2021
# and resolver 2 so it would compile unchanged; this move is deliberately its own
# change, gated on the imported suite, so an edition behavior difference stays
# separable from the move.

[workspace]
resolver = "3"
members = [
    "crates/ppe",
    "crates/ppe-core",
    "crates/ppe-orchestration",
    "crates/ppe-sdk",
    "crates/ppe-builtins",
    "crates/ppe-apl-core",
    "crates/ppe-apl-cmf",
    "crates/ppe-apl-runtime",
    "builtins/plugins/pii-scanner",
    "builtins/plugins/audit-logger",
    "builtins/plugins/identity-jwt",
    "builtins/plugins/delegator-oauth",
    "builtins/plugins/elicitation-ciba",
    "builtins/pdps/cedar-direct",
    "builtins/pdps/cel",
    "builtins/session/valkey",
]

# The session store pulls a redis client and a TLS stack, which slows a default
# build noticeably. Excluding it from default-members keeps everyday iteration
# fast; `--workspace` still picks it up, and CI runs the full sweep.
default-members = [
    "crates/ppe",
    "crates/ppe-core",
    "crates/ppe-orchestration",
    "crates/ppe-sdk",
    "crates/ppe-builtins",
    "crates/ppe-apl-core",
    "crates/ppe-apl-cmf",
    "crates/ppe-apl-runtime",
    "builtins/plugins/pii-scanner",
    "builtins/plugins/audit-logger",
    "builtins/plugins/identity-jwt",
    "builtins/plugins/delegator-oauth",
    "builtins/plugins/elicitation-ciba",
    "builtins/pdps/cedar-direct",
    "builtins/pdps/cel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. Keep in sync with rust-toolchain.toml `channel` and clippy.toml `msrv`.
rust-version = "1.96"
license = "Apache-2.0"
authors = ["Teryl Taylor", "Fred Araujo"]
repository = "https://github.com/praxis-proxy/policy"
# Inherited by the facade crate for its crates.io page. Points at the repository
# until there is a docs site to point at.
homepage = "https://github.com/praxis-proxy/policy"
keywords = ["ai", "agent", "security", "policy", "plugin"]
categories = ["development-tools"]
# Shared crate README resolved from this root. Members opt in with
# `readme.workspace = true` so there is one source and no per-crate copy.
readme = "README.md"

# =============================================================================
# Shared dependencies
# =============================================================================
#
# Third-party entries only. Every imported crate manifest inherits these via
# `{ workspace = true }`, so this table has to exist before the import lands or
# the import fails on unresolved inheritance rather than on anything
# interesting.
#

[workspace.dependencies]
# Minimal tokio feature floor for crates that take `tokio = { workspace = true }`
# without their own `features`. Production code uses time, sync, task/spawn and
# a multi-threaded runtime; `net` and `io` appear only in tests, and the HTTP
# stack unions those back in through feature unification where needed.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_yaml = "0.9"
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
paste = "1"
futures = "0.3"
hashbrown = "0.17"
arc-swap = "1.7"
wildmatch = "2"
rmp-serde = "1"
serde_bytes = "0.11"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# Internal crates. Single source of truth for each one's path and version
# requirement; members depend on these with `{ workspace = true }` so a version
# bump touches only this table. The `version` is required because these publish:
# at publish time cargo substitutes it for the `path`.
#
# The keys are package names, which still carry the engine's previous naming.
# Renaming them is a manifest change across every crate and lands separately, so
# that the import stays a move and the rename stays a rename.
praxis-policy-core                     = { path = "crates/ppe-core",              version = "0.1.0" }
praxis-policy-orchestration            = { path = "crates/ppe-orchestration",     version = "0.1.0" }
praxis-policy-sdk                      = { path = "crates/ppe-sdk",               version = "0.1.0" }
praxis-policy-builtins                 = { path = "crates/ppe-builtins",          version = "0.1.0", default-features = false }
praxis-policy-apl-core                      = { path = "crates/ppe-apl-core",          version = "0.1.0" }
praxis-policy-apl-cmf                       = { path = "crates/ppe-apl-cmf",           version = "0.1.0" }
praxis-policy-apl-runtime                      = { path = "crates/ppe-apl-runtime",       version = "0.1.0" }
praxis-policy-plugin-pii-scanner       = { path = "builtins/plugins/pii-scanner",      version = "0.1.0" }
praxis-policy-plugin-audit-logger      = { path = "builtins/plugins/audit-logger",     version = "0.1.0" }
praxis-policy-plugin-identity-jwt      = { path = "builtins/plugins/identity-jwt",     version = "0.1.0" }
praxis-policy-plugin-delegator-oauth   = { path = "builtins/plugins/delegator-oauth",  version = "0.1.0" }
praxis-policy-plugin-elicitation-ciba  = { path = "builtins/plugins/elicitation-ciba", version = "0.1.0" }
praxis-policy-pdp-cedar-direct         = { path = "builtins/pdps/cedar-direct",        version = "0.1.0" }
praxis-policy-pdp-cel                  = { path = "builtins/pdps/cel",                 version = "0.1.0" }
praxis-policy-session-valkey           = { path = "builtins/session/valkey",           version = "0.1.0" }

# Cross-crate inlining and dead-code elimination, one codegen unit for
# optimization quality.
#
# `panic = "abort"` is deliberately not set. This is a library: aborting would
# take the host process down on a recoverable policy panic and would break any
# consumer that relies on unwinding across the engine boundary.
[profile.release]
lto = true
codegen-units = 1
strip = true

# =============================================================================
# Lint policy
# =============================================================================
#
# Adopted from Praxis so this project holds the same bar. Member crates opt in
# with `[lints] workspace = true`.
#
# Every entry that is not enforced carries one of two tags. The tag answers a
# single question: does this block publish, and if not, why is that defensible?
#
#   gate:   Must reach deny before the crates are published. Carries a measured
#           production site count and is tracked in docs/ratchet.md.
#   parked: Not scheduled. The reason must say why the lint cannot silently
#           change an enforcement decision, which is the only ground for
#           parking one indefinitely. Counts are production sites unless noted.
#
# Counts come from clippy, not from reading the source:
#
#   cargo clippy --workspace --all-targets --all-features -- -W <lint>
#
# A site inside a `#[cfg(test)]` region or a tests/ examples/ target is not a
# production site. Test code is scope-allowed at the module or crate level, so
# the numbers here describe the library's own surface. Measure lints one at a
# time where it matters: some clippy lints suppress each other, and measuring a
# group can report zero for a lint that fires on its own.
#
# Two classes of parked entry are correctness-relevant rather than cosmetic and
# are the strongest candidates for the next gate: `parked: numeric-cast`, where
# a truncation or sign change can alter a comparison, and `parked: unsafe`.
#
# This tree carries Praxis's lint list but not yet all of its enforcement. Of
# Praxis's 171 rules, 94 are enforced identically here, 75 are weaker, and 2 are
# stricter. It also adds `unexpected_cfgs`, which Praxis does not configure.
# Parking the remainder was necessary to import 192 files under a gate none of
# them had been compiled against; it is not a claim that the bar is equal.
# docs/ratchet.md carries the current numbers and how to reproduce them.

[workspace.lints.rust]
# --- Enforced ---
unused_imports = "deny"
unused_variables = "deny"
trivial_numeric_casts = "deny"
macro_use_extern_crate = "deny"
unused_macro_rules = "deny"
meta_variable_misuse = "deny"
keyword_idents_2024 = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
redundant_lifetimes = "deny"
# A stale feature name in a `cfg` predicate is otherwise only a warning, which
# is how a rename can silently disable a gated export. Denying it turns that
# into a build error at the moment the rename happens.
unexpected_cfgs = "deny"
# Closed from the import backlog: measured at zero violations across
# --workspace --all-targets --all-features, so enforcing costs no code change.
unused_extern_crates = "deny"

# --- Parked and gated ---
missing_docs = "allow"                      # parked: docs, 664
dead_code = "allow"                         # parked: hygiene, 2
unreachable_pub = "allow"                   # parked: hygiene, 2
unused_qualifications = "allow"             # parked: hygiene, 45
elided_lifetimes_in_paths = "allow"         # parked: style, 1
private_interfaces = "allow"                # parked: api, 1
unused_mut = "allow"                        # parked: hygiene, 0 production (33 in tests)
missing_debug_implementations = "allow"     # parked: api, 39
# seed: measured. Three upcasts of a concrete Arc/Box to a trait object in the
# plugin registry and payload plumbing.
trivial_casts = "deny"
# seed: measured. Two single-use lifetime parameters in the policy parser.
single_use_lifetimes = "allow"              # parked: style, 2
# seed: measured. One non-binding let on a value with a destructor.
let_underscore_drop = "allow"               # parked: hygiene, 1
# seed: Praxis denies this. Two sites in the source tree assert Send and Sync by
# hand for a write-capability token. Closing this means documenting both with a
# scoped expect attribute or restructuring the token so the assertion is not
# needed. The FFI boundary that was the other reason to park it is not ported.
unsafe_code = "deny"

[workspace.lints.clippy]
