large_futures = "allow"                     # parked: perf, 3
str_to_string = "deny"
string_slice = "deny"
format_push_string = "allow"                # parked: perf, 1
deref_by_slicing = "allow"                  # parked: style, 0 production (4 in tests)
if_then_some_else_none = "allow"            # parked: style, 6
unused_trait_names = "allow"                # parked: hygiene, 10
tests_outside_test_module = "allow"         # parked: test-hygiene, 1 production (217 in tests)
unnecessary_safety_comment = "deny"
renamed_function_params = "allow"           # parked: api, 2
needless_raw_strings = "allow"              # parked: style, 0 production (107 in tests)
needless_raw_string_hashes = "allow"        # parked: style, 0 production (12 in tests); suppressed by needless_raw_strings when both are on
unused_result_ok = "allow"                  # parked: hygiene, 0 production (4 in tests)
unused_async = "allow"                      # parked: hygiene, 1
