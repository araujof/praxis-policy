# Style rather than correctness, and it needs a judgment call per site. The
# scopes where tightening removed a real hazard are closed: the plugin factory
# lookup no longer holds the registry lock across host-supplied `create` code,
# which could re-enter and deadlock. Several remaining sites hold a guard across
# a synchronous call on purpose and say so, and `await_holding_lock` above
# already denies the case that actually deadlocks.
