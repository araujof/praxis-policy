await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
# --- Enforced: memory and allocation ---
implicit_clone = "deny"
inefficient_to_string = "deny"
vec_init_then_push = "deny"
# --- Enforced: idiomatic Rust ---
checked_conversions = "deny"
cloned_instead_of_copied = "deny"
explicit_into_iter_loop = "deny"
flat_map_option = "deny"
from_iter_instead_of_collect = "deny"
manual_instant_elapsed = "deny"
manual_ok_or = "deny"
unnecessary_get_then_check = "deny"
# --- Enforced: borrow and clarity ---
needless_borrow = "deny"
match_bool = "deny"
mut_mut = "deny"
needless_for_each = "deny"
range_plus_one = "deny"
redundant_else = "deny"
semicolon_if_nothing_returned = "deny"
# --- Enforced: import hygiene ---
enum_glob_use = "deny"
macro_use_imports = "deny"
# --- Enforced: clarity ---
same_functions_in_if_condition = "deny"
stable_sort_primitive = "deny"
string_add = "deny"
string_lit_as_bytes = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
zero_sized_map_values = "deny"
fn_params_excessive_bools = "deny"
# --- Enforced: safety and correctness ---
or_fun_call = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
disallowed_methods = "deny"
# --- Enforced: no placeholders ---
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# --- Enforced: closed from the import backlog ---
# Each measured at zero violations across --workspace --all-targets
# --all-features before being enforced, so none of these required a code change.
# Panic and abort sources first: these are the reason the gate exists.
unwrap_used = "deny"
panic = "deny"
exit = "deny"
mem_forget = "deny"
# Concurrency and lifetime hazards.
future_not_send = "deny"
significant_drop_in_scrutinee = "deny"
debug_assert_with_mut_call = "deny"
infinite_loop = "deny"
zombie_processes = "deny"
empty_drop = "deny"
# Numeric and pointer conversions.
lossy_float_literal = "deny"
ptr_as_ptr = "deny"
verbose_bit_mask = "deny"
unseparated_literal_suffix = "deny"
# Diagnostics and test rigor.
print_stdout = "deny"
missing_assert_message = "deny"
missing_safety_doc = "deny"
# API and type shape.
error_impl_error = "deny"
option_option = "deny"
ref_option_ref = "deny"
large_types_passed_by_value = "deny"
empty_structs_with_brackets = "deny"
expl_impl_clone_on_copy = "deny"
same_name_method = "deny"
try_err = "deny"
# Dead state.
collection_is_never_read = "deny"
no_effect_underscore_binding = "deny"
used_underscore_binding = "deny"
# Style and idiom.
if_not_else = "deny"
inconsistent_struct_constructor = "deny"
string_add_assign = "deny"
semicolon_inside_block = "deny"
redundant_type_annotations = "deny"
manual_clamp = "deny"
set_contains_or_insert = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_line_after_outer_attr = "deny"

# --- Parked and gated ---
doc_markdown = "allow"                      # parked: docs, 237
missing_docs_in_private_items = "allow"     # parked: docs, 239
missing_errors_doc = "allow"                # parked: docs, 60
missing_panics_doc = "allow"                # parked: docs, 1
uninlined_format_args = "deny"
redundant_closure_for_method_calls = "deny"
manual_let_else = "allow"                   # parked: style, 22
return_self_not_must_use = "allow"          # parked: api, 40
items_after_statements = "allow"            # parked: style, 6
map_unwrap_or = "allow"                     # parked: style, 16
match_same_arms = "allow"                   # parked: style, 37
explicit_iter_loop = "deny"
unnested_or_patterns = "allow"              # parked: style, 5
needless_continue = "allow"                 # parked: style, 5
assigning_clones = "allow"                  # parked: perf, 5
wildcard_imports = "allow"                  # parked: style, 4
manual_string_new = "allow"                 # parked: style, 0 production (4 in tests)
manual_assert = "allow"                     # parked: style, 0 production (1 in tests)
unused_self = "allow"                       # parked: hygiene, 1
unreadable_literal = "allow"                # parked: style, 0 production (2 in tests)
clone_on_ref_ptr = "allow"                  # parked: perf, 7
default_trait_access = "allow"              # parked: style, 3
match_wildcard_for_single_variants = "allow"# parked: style, 2
single_match_else = "allow"                 # parked: style, 11
