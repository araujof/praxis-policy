# APL core — predicate language, compiler, evaluator.
# Module structure follows docs/specs/apl-design.md §4.

[package]
name = "praxis-policy-apl-core"
description = "APL — Authorization Policy Language core (compiler + evaluator)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.cargo-machete]
# serde is used through its derive macros (Serialize/Deserialize), which
# cargo-machete's source scan does not reliably detect. It is a real dependency.
ignored = ["serde"]

[lib]
# Plain rlib; APL is consumed by other workspace crates (praxis-policy-apl-cmf, praxis-policy-apl-runtime)
# and does not need cdylib for FFI.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }
praxis-policy-orchestration = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
