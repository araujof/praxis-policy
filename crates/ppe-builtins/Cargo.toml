#
# praxis-policy-builtins — the bundled PPE extension set behind cargo features.
#
# A host depends on this one crate to get the built-in plugins, PDPs, and
# session stores; the feature list picks exactly what compiles in and gets
# registered. `register_builtins` / `builtin_pdps` /
# `builtin_session_store_factories` are #[cfg]-gated to the selected
# features, so there is no code change between configurations — only the
# feature list. Both this project's facade delegates here, as does the CPEX FFI layer so the
# registration set lives in one place.

[package]
name = "praxis-policy-builtins"
description = "PPE built-in plugins, PDPs, and session stores with feature-gated registration."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# The common in-process set: the four hook plugins plus both PDPs. Heavier
# / external-backend extensions (valkey) stay opt-in via `full`.
default = ["pii-scanner", "audit-logger", "identity-jwt", "delegator-oauth", "elicitation-ciba", "cedar-direct", "cel", "opa"]

# Each feature pulls exactly one builtin crate.
pii-scanner      = ["dep:praxis-policy-plugin-pii-scanner"]
audit-logger     = ["dep:praxis-policy-plugin-audit-logger"]
identity-jwt     = ["dep:praxis-policy-plugin-identity-jwt"]
delegator-oauth  = ["dep:praxis-policy-plugin-delegator-oauth"]
elicitation-ciba = ["dep:praxis-policy-plugin-elicitation-ciba"]
cedar-direct     = ["dep:praxis-policy-pdp-cedar-direct"]
cel              = ["dep:praxis-policy-pdp-cel"]
opa              = ["dep:praxis-policy-pdp-opa"]
valkey           = ["dep:praxis-policy-session-valkey"]

# Everything wired here, including the Valkey session store (redis client +
# rustls TLS stack).
full = ["default", "valkey"]

[dependencies]
# Registration targets — the manager, PDP factory trait, and APL options.
praxis-policy-core = { workspace = true }
praxis-policy-apl-core = { workspace = true }
praxis-policy-apl-runtime = { workspace = true }

# Builtin extension crates — each behind its feature.
praxis-policy-plugin-pii-scanner = { workspace = true, optional = true }
praxis-policy-plugin-audit-logger = { workspace = true, optional = true }
praxis-policy-plugin-identity-jwt = { workspace = true, optional = true }
praxis-policy-plugin-delegator-oauth = { workspace = true, optional = true }
praxis-policy-plugin-elicitation-ciba = { workspace = true, optional = true }
praxis-policy-pdp-cedar-direct = { workspace = true, optional = true }
praxis-policy-pdp-cel = { workspace = true, optional = true }
praxis-policy-pdp-opa = { workspace = true, optional = true }
praxis-policy-session-valkey = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
