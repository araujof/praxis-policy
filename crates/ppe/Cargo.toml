# praxis-policy — host facade.
#
# One dependency instead of a dozen: re-exports the host runtime
# (PolicyEngine, AplOptions, register_apl) and owns the registration of the
# bundled plugins, PDPs and session stores. Each is behind a feature, so the bare
# dependency is the engine alone, no plugins compiled.
#
#   praxis-policy = { version = "0.1", features = ["builtins"] }      # every builtin
#   praxis-policy = { version = "0.1", features = ["jwt", "cedar"] }  # a subset
#
# then `praxis_policy::install_builtins(&mgr)` registers every enabled factory and
# installs the APL config visitor in one call.

[package]
name = "praxis-policy"
description = "PPE host facade — re-exports the runtime and (optionally) the feature-gated builtin extensions."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# Use the project's root README as this crate's crates.io page (inherited path
# is workspace-root-relative; cargo bundles it into the published .crate).
readme.workspace = true

# Build docs.rs with every extension enabled. The default build is engine-only
# (`default = []`), which compiles no builtin at all, so without this the factory
# re-exports and `install_builtins` are absent from the rendered docs.
[package.metadata.docs.rs]
all-features = true

[features]
# Engine only by default: no builtin plugins are compiled in. Opt into every
# bundled extension with `builtins`, or name granular features for a subset.
default = []

# Every builtin, including the Valkey session store and the redis + TLS stack it
# carries.
builtins = [
    "jwt",
    "oauth",
    "elicitation-ciba",
    "cedar",
    "cel",
    "opa",
    "valkey",
]

# One feature per builtin crate. The names are the public API: a host writes
# these, so they are deliberately shorter than the crate names they pull.
jwt = ["_builtin", "dep:praxis-policy-plugin-identity-jwt"]
oauth = ["_builtin", "dep:praxis-policy-plugin-delegator-oauth"]
elicitation-ciba = ["_builtin", "dep:praxis-policy-plugin-elicitation-ciba"]
cedar = ["_builtin", "dep:praxis-policy-pdp-cedar-direct"]
cel = ["_builtin", "dep:praxis-policy-pdp-cel"]
opa = ["_builtin", "dep:praxis-policy-pdp-opa"]
valkey = ["_builtin", "dep:praxis-policy-session-valkey"]

# Private marker meaning "at least one builtin is enabled", which is what gates
# the registration helpers. Not for hosts to name. It exists because the
# alternative is repeating a nine-arm `any(feature = ...)` at every gate, and one
# missed arm there is a silently absent registration.
_builtin = []

[dependencies]
# Host runtime — always present, this is the point of the facade.
praxis-policy-core = { workspace = true }
praxis-policy-apl-core = { workspace = true }
praxis-policy-apl-cmf = { workspace = true }
praxis-policy-apl-runtime = { workspace = true }

# Bundled extension crates, each behind its feature above.
#
# Not everything shipped in this repository belongs here. `reference/` holds
# unpublished examples a host registers itself; each of those manifests says why it
# is not a builtin.
praxis-policy-plugin-identity-jwt = { workspace = true, optional = true }
praxis-policy-plugin-delegator-oauth = { workspace = true, optional = true }
praxis-policy-plugin-elicitation-ciba = { workspace = true, optional = true }
praxis-policy-pdp-cedar-direct = { workspace = true, optional = true }
praxis-policy-pdp-cel = { workspace = true, optional = true }
praxis-policy-pdp-opa = { workspace = true, optional = true }
praxis-policy-session-valkey = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
