# Authors: Fred Araujo
#
# praxis-policy — host facade.
#
# One dependency instead of a dozen: re-exports the host runtime
# (PluginManager, AplOptions, register_apl). The bundled plugins, PDPs, and
# session stores live in `praxis-policy-builtins` and are pulled in only when the
# `builtins` feature (or a granular plugin feature) is enabled, so the bare
# dependency is the engine alone, no plugins compiled.
#
#   praxis-policy = { version = "0.1", features = ["builtins"] }      # every builtin
#   praxis-policy = { version = "0.1", features = ["jwt", "cedar"] }  # a subset
#
# then `praxis_policy::install_builtins(&mgr)` registers every enabled factory and
# installs the APL config visitor in one call.

[package]
name = "praxis-policy"
description = "PPE host facade — re-exports the runtime and (optionally) the feature-gated builtin extensions."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# Use the project's root README as this crate's crates.io page (inherited path
# is workspace-root-relative; cargo bundles it into the published .crate).
readme.workspace = true

# Build docs.rs with every extension enabled. The default build is engine-only
# (`default = []`), which omits praxis-policy-builtins entirely — so without this the
# builtins re-exports and `install_builtins` are absent and the intra-doc link
# to `praxis-policy-builtins` does not resolve on docs.rs.
[package.metadata.docs.rs]
all-features = true

[features]
# Engine only by default: no builtin plugins are compiled in. Opt into every
# bundled extension with `builtins`, or name granular features for a subset.
# Either way the optional `praxis-policy-builtins` dependency is enabled and the
# matching praxis-policy-builtins feature is forwarded.
default = []

# Every builtin, including the Valkey session store and the redis + TLS stack it
# carries. Composed from this crate's own granular features rather than from the
# aggregator's umbrella, because the concrete factory re-exports in lib.rs are
# gated on these names: forwarding straight to `praxis-policy-builtins/default`
# compiles the builtins in but leaves their types unexported.
builtins = [
    "jwt",
    "oauth",
    "pii",
    "audit",
    "elicitation-ciba",
    "cedar",
    "cel",
    "opa",
    "valkey",
]

# Granular passthroughs. Each pulls exactly one builtin via praxis-policy-builtins.
jwt = ["praxis-policy-builtins/identity-jwt"]
oauth = ["praxis-policy-builtins/delegator-oauth"]
pii = ["praxis-policy-builtins/pii-scanner"]
audit = ["praxis-policy-builtins/audit-logger"]
elicitation-ciba = ["praxis-policy-builtins/elicitation-ciba"]
cedar = ["praxis-policy-builtins/cedar-direct"]
cel = ["praxis-policy-builtins/cel"]
opa = ["praxis-policy-builtins/opa"]
valkey = ["praxis-policy-builtins/valkey"]

[dependencies]
# Host runtime — always present, this is the point of the facade.
praxis-policy-core = { workspace = true }
praxis-policy-apl-core = { workspace = true }
praxis-policy-apl-cmf = { workspace = true }
praxis-policy-apl-runtime = { workspace = true }

# Bundled extension set — present only when a builtins feature is enabled.
# `default-features = false` so the granular plugin features compose; an
# enabling feature turns on exactly the praxis-policy-builtins features it names.
praxis-policy-builtins = { workspace = true, optional = true, default-features = false }

[lints]
workspace = true
