# Authors: Teryl Taylor
#
# praxis-policy-plugin-audit-logger — CMF plugin that emits a structured audit
# record for every dispatched request. Subject, client, action,
# delegation outcome, and capability-filtered context fields land
# in a single JSON line per call. Always allows; never blocks.

[package]
name = "praxis-policy-plugin-audit-logger"
# Not published, and not part of the `builtins` umbrella.
#
# The record shape is useful; the sink is not. It writes to stderr or
# `tracing::info!`, and every real deployment routes audit somewhere specific: a
# SIEM, a queue, an append-only store. Shipping this as a supported builtin would
# have us versioning a stderr writer.
#
# It stays in the workspace so it is built, linted and tested on every change,
# and so it doubles as a reference implementation of an out-of-tree plugin. A
# host registers it with `PluginManager::register_factory`; the CPEX demo does
# exactly that. See `praxis_policy_core::prelude` for the author-facing surface.
publish = false
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
description = "PPE CMF plugin — structured per-request audit logging."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-core = { workspace = true }

async-trait = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
