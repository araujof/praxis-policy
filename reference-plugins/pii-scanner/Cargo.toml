#
# praxis-policy-plugin-pii-scanner — CMF plugin that detects PII patterns (SSN,
# credit card, email) in tool/prompt/resource args and either denies
# the call, taints the session, or redacts the matching values.

[package]
name = "praxis-policy-plugin-pii-scanner"
# Not published, and not part of the `builtins` umbrella.
#
# The detectors are regexes, and the credit-card one does not Luhn-check (see
# `PiiPattern::CreditCard`). That is fine for a worked example and not fine as a
# supported builtin of a security product, where operators would reasonably read
# "bundled PII scanner" as data-loss prevention. Real deployments want Presidio,
# a cloud DLP API, or their own detectors.
#
# It stays in the workspace so it is built, linted and tested on every change,
# and so it doubles as a reference implementation of an out-of-tree plugin. A
# host registers it with `PluginManager::register_factory`; the CPEX demo does
# exactly that. See `praxis_policy_core::prelude` for the author-facing surface.
publish = false
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
description = "PPE CMF plugin — detects and redacts PII (SSN, credit card, email) in tool/prompt args."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
praxis-policy-core = { workspace = true }

async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
regex       = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
